<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiếng Anh Siêu Mất Gốc</title>
<style>
:root{
  --bg:#F7F4EE; --card:#FFFFFF; --ink:#1C2430; --mut:#6B7280; --line:#E7E1D6;
  --pri:#0E6B5C; --pri-2:#E3F1EE; --acc:#E8A33D; --acc-2:#FBF0DC;
  --ok:#15803D; --ok-2:#E5F4EA; --bad:#C2412D; --bad-2:#FBE8E4;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 96px}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:24px;font-weight:750;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:650}
p{margin:0}
.mut{color:var(--mut)} .sm{font-size:14px} .xs{font-size:12.5px}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.top .grow{flex:1;min-width:0}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:20px;
  box-shadow:0 0 0 1px var(--line);cursor:pointer;color:var(--ink)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.hero{background:var(--pri);color:#fff;box-shadow:none}
.hero .mut{color:#CFE7E1}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;background:var(--pri);color:#fff;min-height:46px}
.btn.full{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn.soft{background:var(--pri-2);color:var(--pri)}
.btn.warn{background:var(--bad-2);color:var(--bad)}
.btn.acc{background:var(--acc);color:#2B1D05}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:46px}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:1px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#F1EDE5;color:#4B5563;white-space:nowrap}
.chip.ok{background:var(--ok-2);color:var(--ok)} .chip.bad{background:var(--bad-2);color:var(--bad)}
.chip.acc{background:var(--acc-2);color:#8A5A12} .chip.pri{background:var(--pri-2);color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:8px;background:#EAE4D8;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.hero .bar{background:rgba(255,255,255,.22)} .hero .bar>i{background:#FFD58A}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}
.card .stat{background:#F6F2EA}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:14px;
  box-shadow:0 0 0 1px var(--line);margin-bottom:8px;cursor:pointer;width:100%;border:0;font:inherit;color:inherit;text-align:left}
.lesson .num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:750;background:#F1EDE5;flex:none}
.lesson.done .num{background:var(--ok-2);color:var(--ok)}
.lesson.next{box-shadow:0 0 0 2px var(--acc)}
.lesson.next .num{background:var(--acc-2);color:#8A5A12}
.lesson.locked{opacity:.5;cursor:default}
.lesson .grow{flex:1;min-width:0}
.lesson .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sect{margin:20px 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tabs{display:flex;background:#ECE6DB;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:inherit;font-size:14.5px;font-weight:650;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flash{background:var(--card);border-radius:22px;box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(28,36,48,.06);
  min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;cursor:pointer;user-select:none}
.flash .en{font-size:34px;font-weight:750;letter-spacing:-.01em}
.flash .vi{font-size:22px;color:var(--pri);font-weight:650;margin-top:10px}
.flash .hint{margin-top:16px}
.speak{border:0;background:var(--pri-2);color:var(--pri);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;flex:none;display:grid;place-items:center}
.speak.big{width:84px;height:84px;font-size:36px;margin:8px auto}
.pat{display:flex;gap:10px;align-items:flex-start}
.pat .en{font-weight:650}
.note{background:var(--acc-2);border-radius:var(--r);padding:14px 16px;font-size:15px}
.note b{display:block;margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;border:0;background:var(--card);box-shadow:0 0 0 1.5px var(--line);border-radius:14px;
  padding:14px 16px;font:inherit;font-size:17px;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.opt.right{box-shadow:0 0 0 2px var(--ok);background:var(--ok-2)}
.opt.wrong{box-shadow:0 0 0 2px var(--bad);background:var(--bad-2)}
.opt:disabled{cursor:default}
.qprompt{font-size:21px;font-weight:700;margin:6px 0 18px;line-height:1.35}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:54px}
.tok{border:0;background:var(--card);box-shadow:0 0 0 1.5px var(--line);border-radius:10px;padding:9px 13px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink)}
.tok.used{visibility:hidden}
.answer-line{border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:16px}
.answer-line .tok{background:var(--pri-2);box-shadow:none}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-weight:600}
.fb.ok{background:var(--ok-2);color:var(--ok)} .fb.bad{background:var(--bad-2);color:var(--bad)}
.fb .mut{font-weight:500}
.big-score{font-size:64px;font-weight:800;line-height:1;margin:8px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:650;color:var(--mut);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--pri)}
.stu{cursor:pointer}
.stu.alert{box-shadow:0 0 0 1.5px #EBB3A8}
.toggle{width:52px;height:32px;border-radius:99px;border:0;background:#DDD6C9;position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--ok)} .toggle.on::after{left:23px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;background:#F1EDE5;padding:3px 8px;border-radius:8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:0;background:var(--pri-2);color:var(--pri);font-size:22px;font-weight:700;cursor:pointer}
.stepper b{font-size:22px;min-width:36px;text-align:center}
.banner{background:var(--acc-2);color:#7A4E0C;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
textarea{width:100%;min-height:160px;font:inherit;font-size:14.5px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--mut)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td,table.mini th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.mini th{font-size:12.5px;color:var(--mut);font-weight:650}
.logo{width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:14px}
.hero .stat{background:rgba(255,255,255,.14)}
.tabs button{font-size:13.5px;padding:9px 2px}
.who{width:30px;height:30px;border-radius:50%;background:var(--pri-2);color:var(--pri);display:grid;place-items:center;font-weight:750;font-size:14px;flex:none}
.who.b{background:var(--acc-2);color:#8A5A12}
.dline.on{box-shadow:0 0 0 2px var(--acc)}
.pat .grow{flex:1;min-width:0}
.tabs.six button{font-size:12.5px;padding:9px 1px}
.abc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.abc-c{position:relative;border:0;background:#fff;box-shadow:0 0 0 1.5px var(--line);border-radius:12px;padding:10px 2px 7px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:84px}
.abc-c b{font-size:24px;font-weight:700;letter-spacing:1px;line-height:1.1}
.abc-c.v{background:var(--acc-2);box-shadow:0 0 0 1.5px #E8C88E}
.abc-c.v b{color:#8A4F06}
.abc-r{font-size:12.5px;font-weight:650;color:var(--pri)}
.abc-w{font-size:11px;color:var(--mut)}
.abc-b{position:absolute;top:-7px;right:-3px;font-size:9.5px;font-weight:700;color:#B42318;background:#FDECEA;border-radius:99px;padding:1px 5px;box-shadow:0 0 0 1.5px #fff}
.abc-c:active{transform:scale(.96)}
.abc-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.spell{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 12px}
.spell-l{min-width:40px;height:48px;border-radius:10px;background:#F1EDE5;display:grid;place-items:center;font-size:26px;font-weight:750;transition:all .15s}
.spell-l.on{background:var(--pri);color:#fff;transform:translateY(-3px)}
.tok.on{background:var(--pri-2);box-shadow:0 0 0 2px var(--pri)}
body.wide #app{max-width:1100px}
.board{background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px var(--line);overflow:hidden;touch-action:none}
#bd{display:block;width:100%;aspect-ratio:4/3;touch-action:none;cursor:crosshair;background-image:radial-gradient(#E7E1D6 1px,transparent 1px);background-size:24px 24px}
.pen{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.pen.on{box-shadow:0 0 0 2.5px var(--ink)}
.board{position:relative}
.btext{position:absolute;display:flex;align-items:center;gap:4px;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(28,36,48,.18),0 0 0 2px var(--pri);padding:3px;z-index:2;max-width:calc(100% - 8px)}
.btext input{border:0;min-height:36px;padding:4px 8px;font-size:16px;font-weight:600;width:170px;outline:none}
.btext button{border:0;width:34px;height:34px;border-radius:8px;font-size:17px;cursor:pointer;flex:none}
.bt-ok{background:var(--pri);color:#fff}.bt-x{background:#F1EDE5;color:var(--ink)}

/* ---- Bảng lớp: to nhất có thể, vừa khít màn hình ---- */
body.boardv #app{max-width:none;padding:0 10px 8px;min-height:0}
body.boardv .nav{display:none}
.bview{display:flex;flex-direction:column;gap:8px}
.bmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.btop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 2px}
.btop .back{width:36px;height:36px;font-size:18px}
.btitle{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.btitle b{font-size:16px}
.btop .pen{width:30px;height:30px}
.bsm{min-height:34px !important;padding:5px 11px !important;font-size:14px}
.bgate.on{box-shadow:0 0 0 1.5px var(--ok);color:var(--ok)}
.bprompt{padding:8px 12px !important}
.bprompt .bq{font-weight:700;font-size:16px;line-height:1.3}
.bfit{display:flex;justify-content:center}
.bfit .board{width:100%;flex:none}
.bside{display:flex;flex-direction:column;gap:8px}
.bhelp{margin:0 2px}
@media (min-width:1000px) and (orientation:landscape){
  .bview.t{flex-direction:row;align-items:flex-start}
  .bview.t .bside{width:280px;flex:none;padding-top:10px;max-height:100vh;overflow:auto}
  .bview.t .bbtns{flex-direction:column;align-items:stretch}
}
.brot{display:none;text-align:center;margin:2px 0 0}
@media (orientation:portrait) and (max-width:600px){ .brot{display:block} }
/* Điện thoại xoay ngang: thanh công cụ dựng dọc bên trái để bảng cao hết màn hình */
@media (orientation:landscape) and (max-height:520px){
  body.boardv #app{padding:0 6px 4px}
  .bmain{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:8px;row-gap:4px}
  .btop{grid-row:1 / span 2;flex-direction:column;flex-wrap:nowrap;padding:4px 0;gap:5px;align-items:center}
  .btop .bl,.btitle b{display:none}
  .btitle{margin:0;align-items:center}
  .btitle #bstatus{font-size:0}
  .btitle #bstatus::first-letter{font-size:13px}
  .btop .pen{width:26px;height:26px;border-width:2px}
  .btop .back{width:32px;height:32px}
  .bsm{min-height:30px !important;padding:3px 8px !important}
  .bprompt{grid-column:2;padding:5px 10px !important}
  .bprompt .bq{font-size:14px}
  .bfit{grid-column:2}
}
.recrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rbtn{border:0;background:var(--pri-2);color:var(--pri);border-radius:10px;padding:6px 10px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
.rbtn.on{background:var(--bad);color:#fff;animation:recpulse 1s infinite}
@keyframes recpulse{50%{opacity:.6}}

/* ---- Gọi thoại cả lớp ---- */
#callui{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 10px}
body.boardv #callui{bottom:8px}
.callbar{pointer-events:auto;width:100%;max-width:560px;background:#1C2430;color:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.callbar.ring{flex-direction:row;align-items:center;gap:10px;animation:callpulse 1.6s infinite}
@keyframes callpulse{50%{box-shadow:0 0 0 6px rgba(232,163,61,.45),0 8px 28px rgba(0,0,0,.25)}}
.callbar .cico{font-size:24px}
.callbar .xs{color:#C9D2DC}
.callbar .mut{color:#AEB8C4}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cinfo{background:none;border:0;color:#fff;font:inherit;font-size:14px;padding:6px 2px;cursor:pointer;flex:1;text-align:left;min-width:120px}
.cbtn{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:#33404F;color:#fff;min-height:40px}
.cbtn.go{background:#0E6B5C}.cbtn.mut{background:#E8A33D;color:#1C2430}.cbtn.end{background:#C2412D}
.cbtn[disabled]{opacity:.6}
.cdot{width:10px;height:10px;border-radius:50%;background:#56616E;flex:none;transition:background .15s,box-shadow .15s}
.cdot.live{background:#3DDC84}
.cdot.talk{background:#3DDC84;box-shadow:0 0 0 4px rgba(61,220,132,.3)}
.cplist{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto;padding:4px 2px 8px;border-bottom:1px solid #33404F}
.cprow{display:flex;align-items:center;gap:10px;font-size:14px}
</style>
</head>

<div id="app"></div>

{n:7,t:"Gia đình",gt:"Tính từ sở hữu; sở hữu cách 's; me / him / her / them",
g:"Tính từ sở hữu đứng trước danh từ: I → my, you → your, he → his, she → her, we → our, they → their, it → its. Ví dụ: my father, her son. 'have' nghĩa là có: I have a sister. Sở hữu cách 's: tên người + 's + đồ vật, nghĩa là “của ai”: Lan's phone = điện thoại của Lan, my brother's wife = vợ của anh tôi. Đại từ làm tân ngữ (đứng sau động từ): I → me, he → him, she → her, we → us, they → them. Ví dụ: I love them. Call me.",

p:["This is my family.|Đây là gia đình tôi.","Her name is Hoa.|Tên cô ấy là Hoa.","I have two brothers.|Tôi có hai anh em trai.","His wife is a teacher.|Vợ anh ấy là giáo viên.","Their children are students.|Con của họ là học sinh.","My uncle is a driver.|Chú tôi là tài xế.","I'm an only child.|Tôi là con một.","Your baby is very cute.|Em bé của bạn rất dễ thương.","This is Lan's husband.|Đây là chồng của Lan.","My brother's name is Nam.|Anh trai tôi tên là Nam.","I love them very much.|Tôi rất yêu họ.","Call me, please.|Gọi cho tôi nhé."],

{n:11,t:"Thời gian",gt:"Giờ, thứ, 12 tháng; in / on / at; always / never",
g:"Giờ đúng: It's + số + o'clock. Giờ rưỡi: half past + giờ (half past eight = 8:30). Thứ dùng on (on Monday), giờ dùng at (at 7), tháng dùng in (in May). Trạng từ tần suất đứng trước động từ thường (I always eat) và sau to be (She is never late). Ghi nhớ nhanh: AT + giờ (at 7, at night), ON + thứ, ngày (on Monday, on May 5th), IN + tháng, năm, buổi (in May, in 2025, in the morning). 12 tháng luôn viết hoa chữ cái đầu.",

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return store._m[k] ?? null; } },

const API_URL = 'https://script.google.com/macros/s/AKfycbx0mpQiK37upTGwb4zKz0rld4x8bHGIOHaExb2X16-NPbCoNo-bygtJZRINILf-X6hX/exec';   /* máy chủ tự điền link app vào đây khi mở trang */
const REAL = HAS_GAS || !!API_URL;   /* có máy chủ thật (Google Sheet) hay đang là bản xem thử */
function gasRun(fn, args){
  return new Promise((res, rej) => { google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args); });
}
function call(fn, ...args){
  if (API_URL) {
    /* gọi máy chủ không kèm tài khoản Google của trình duyệt: chạy được cả khi máy đăng nhập nhiều tài khoản */
    return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({fn, args}), credentials:'omit', redirect:'follow'})
      .then(r => r.json())
      .then(o => { if (!o.ok) throw new Error(o.error); return o.r; },
            e => { if (HAS_GAS) return gasRun(fn, args); throw e; });
  }
  if (HAS_GAS) return gasRun(fn, args);
  return new Promise((res, rej) => setTimeout(() => { try { res(Mock[fn](...args)); } catch(e){ rej(e); } }, 150));
}

/* ---- Bản xem thử: giả lập máy chủ, lưu trên máy này ---- */
const Mock = (() => {
  const DAY = 864e5, now = Date.now();
  function seed(){
    const st = [
      {code:'LA123',name:'Nguyễn Thị Lan',added:now-20*DAY,lastActive:now-3*36e5,reviews:6},
      {code:'MI456',name:'Trần Văn Minh',added:now-20*DAY,lastActive:now-4*DAY},
      {code:'HO789',name:'Lê Thu Hoa',added:now-20*DAY,lastActive:now-DAY,reviews:2}
    ];
    const pr = [];
    const sc = {LA123:[95,90,100,85],MI456:[80,65],HO789:[90,85,70,0]};
    Object.keys(sc).forEach(c => sc[c].forEach((s,i) => { if (s) pr.push({code:c,n:i+1,best:s,attempts:1+(s<80?1:0),learned:10,at:now-(5-i)*DAY}); }));
    const att = {};
    [1,2,3,4].forEach(n => att[n] = {date:now-(10-n*2)*DAY, present: n===3 ? ['LA123','HO789'] : ['LA123','MI456','HO789']});
    return {students:st, progress:pr, attendance:att, unlocked:5, className:'Lớp xem thử'};
  }
  let D;
  try { D = JSON.parse(store.get('demo_db2')) || seed(); } catch(e){ D = seed(); }
  const save = () => store.set('demo_db2', JSON.stringify(D));
  const pw = p => { if (String(p) !== DEMO_PW) throw new Error('Sai mật khẩu giáo viên'); };
  const find = c => D.students.find(s => s.code === String(c||'').trim().toUpperCase());
  function sState(s){
    const prog = {}; D.progress.filter(p => p.code === s.code).forEach(p => prog[p.n] = p);
    const held = Object.keys(D.attendance).length;
    const present = Object.values(D.attendance).filter(a => a.present.includes(s.code)).length;
    return {ok:true, student:{code:s.code,name:s.name}, unlocked:D.unlocked, className:D.className, progress:prog, attendance:{held,present}, reviews:s.reviews||0};
  }
  const tData = () => JSON.parse(JSON.stringify({ok:true, ...D, appUrl:''}));
  return {
    studentLogin(c){ const s = find(c); if (!s) return {ok:false,error:'Không tìm thấy mã học viên này. Hỏi lại giáo viên nhé.'}; s.lastActive = Date.now(); save(); return sState(s); },
    saveProgress(c,n,score,learned){
      const s = find(c); if (!s) return {ok:false,error:'Mã học viên không còn trong lớp.'};
      let p = D.progress.find(x => x.code === s.code && x.n === n);
      if (!p) { p = {code:s.code,n,best:0,attempts:0,learned:0}; D.progress.push(p); }
      if (score !== null && score !== undefined) { p.best = Math.max(p.best, score); p.attempts++; }
      p.learned = Math.max(p.learned, learned||0); p.at = Date.now(); s.lastActive = Date.now(); save(); return sState(s);
    },
    logReview(c, score){ const s = find(c); if (!s) return {ok:false,error:'Mã học viên không còn trong lớp.'}; s.reviews = (s.reviews||0) + 1; s.lastActive = Date.now(); save(); return sState(s); },
    teacherData(p){ pw(p); return tData(); },
    addStudent(p,name){ pw(p); name = String(name||'').trim(); if (!name) throw new Error('Chưa nhập tên');
      const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c;
      do { c = L[Math.random()*24|0] + L[Math.random()*24|0] + (100 + Math.random()*900|0); } while (find(c));
      D.students.push({code:c,name,added:Date.now(),lastActive:0}); save(); return tData(); },
    removeStudent(p,c){ pw(p); D.students = D.students.filter(s => s.code !== c); save(); return tData(); },
    setUnlocked(p,n){ pw(p); D.unlocked = Math.max(1, Math.min(24, n)); save(); return tData(); },
    setClassName(p,name){ pw(p); D.className = String(name||'').trim() || D.className; save(); return tData(); },
    saveAttendance(p,n,codes){ pw(p); D.attendance[n] = {date:Date.now(), present:codes.slice()}; if (n > D.unlocked) D.unlocked = n; save(); return tData(); },
    reset(){ D = seed(); save(); }
  };
})();

const AUD = {}, AUD_P = {};
function loadAudio(name){
  if (AUD[name]) return Promise.resolve(AUD[name]);
  if (!AUD_P[name]) {
    const get = HAS_GAS ? call('getAudio', name).then(t => t ? JSON.parse(t) : {})
                        : (typeof fetch === 'function' ? fetch('audio/' + name + '.json').then(r => r.ok ? r.json() : {}) : Promise.resolve({}));
    AUD_P[name] = get.catch(() => ({})).then(m => (AUD[name] = m || {}));
  }

}
const loadLesson = n => {
  try {   /* tải trước bản ghi người thật của buổi này để bấm là nghe ngay */
    const les = L(n);
    if (les && !les.review && !les.srs) {
      const keys = [...les.w.map(x => x.split('|')[0]), ...((les.pr && les.pr.w) || [])];
      if (n === 1) keys.push(...ALPHA.map(a => 'letter:' + a[0]));
      preloadHuman(keys);
    }
  } catch(e){}
  return Promise.all(['w' + n, 's' + n].map(loadAudio));
};

async function recStart(k){

  const chunks = [], mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (chunks.length) { if (REC.urls[k]) URL.revokeObjectURL(REC.urls[k]); REC.urls[k] = URL.createObjectURL(new Blob(chunks, {type:mr.mimeType || 'audio/webm'})); }

    if (REC.urls[k]) playUrl(REC.urls[k]);

  mr.start(); REC.mr = mr; REC.cur = k; REC.timer = setTimeout(recStop, 10000);

}

function humanSeq(key){
  key = String(key);
  if (PAIR_MODE && PAIR_TTS.has(key)) return null;
  if (HUMAN.m[key]) return [HUMAN.m[key][0]];
  if (key.includes(' – ')) { const ps = key.split(' – '); if (ps.every(x => HUMAN.m[x])) return ps.map(x => HUMAN.m[x][0]); }
  return null;
}
const PRE = new Map();
function preloadHuman(keys){
  keys.forEach(k => { const hs = humanSeq(k); if (!hs) return; hs.forEach(pth => { if (PRE.has(pth)) return; const a = new Audio(); a.preload = 'auto'; a.src = HURL(pth); PRE.set(pth, a); }); });
  if (PRE.size > 200) [...PRE.keys()].slice(0, PRE.size - 200).forEach(k => PRE.delete(k));

let HSEQ = 0;
function playHuman(paths, key, onend){
  const tok = ++HSEQ; let i = 0, failed = false;
  if (HAS_TTS) speechSynthesis.cancel();
  const fallback = () => {          /* mạng lỗi: quay về bản thu sẵn trong app */
    if (tok !== HSEQ || failed) return; failed = true; AU.onerror = null;
    const b = findClip(key);
    if (b) { AU.onended = onend || null; AU.src = 'data:audio/mpeg;base64,' + b; const p = AU.play(); if (p) p.catch(() => {}); }
    else if (onend) setTimeout(onend, 600);
  };
  const next = () => {
    if (tok !== HSEQ || failed) return;
    if (i >= paths.length) { AU.onended = null; if (onend) onend(); return; }
    AU.onended = () => setTimeout(next, 200);
    AU.onerror = fallback;
    AU.src = HURL(paths[i++]);
    const p = AU.play(); if (p) p.catch(e => { if (!e) return; if (e.name === 'NotAllowedError') soundHelp(); else if (e.name !== 'AbortError') fallback(); });
  };
  next();
}
function playClip(key, onend){
  const hs = humanSeq(key);
  if (hs) { try { playHuman(hs, key, onend); } catch(e){ soundHelp(); } return true; }
  const b = findClip(key);
  if (!b) return false;
  try {
    HSEQ++; AU.onerror = null;
    if (HAS_TTS) speechSynthesis.cancel();
    AU.onended = onend || null;
    AU.src = 'data:audio/mpeg;base64,' + b;
    const p = AU.play(); if (p) p.catch(e => { if (e && e.name !== 'AbortError') soundHelp(); });
  } catch(e){ soundHelp(); }
  return true;
}

let SEQ = 0;
function playSeq(keys, onStep, gap){
  const tok = ++SEQ;
  const step = i => {
    if (tok !== SEQ) return;
    if (onStep) onStep(i);
    if (i >= keys.length) return;
    if (!playClip(keys[i], () => setTimeout(() => step(i + 1), gap || 250))) { speak(keys[i]); setTimeout(() => step(i + 1), 900); }
  };

}

function playDialogue(lines){
  const keys = lines.map(ln => ln.who === 'B' ? 'B|' + ln.en : ln.en);
  if (keys.every(findClip)) {
    const mark = i => document.querySelectorAll('.dline').forEach((el, k) => el.classList.toggle('on', k === i));
    const step = i => { if (i >= keys.length) { mark(-1); return; } mark(i); playClip(keys[i], () => setTimeout(() => step(i + 1), 350)); };
    step(0); return;
  }
  if (!HAS_TTS) { soundHelp(); return; }
  try {
    speechSynthesis.cancel();
    lines.forEach((ln, i) => {
      const u = utter(ln.en, ln.who);
      u.onstart = () => document.querySelectorAll('.dline').forEach((el, k) => el.classList.toggle('on', k === i));
      if (i === 0) watch(u);
      u.onend = () => { if (i === lines.length - 1) document.querySelectorAll('.dline').forEach(el => el.classList.remove('on')); };
      speechSynthesis.speak(u);
    });
  } catch(e){}
}
function speak(text, who){
  if (playClip(who === 'B' ? 'B|' + text : text)) return;
  if (!HAS_TTS) { soundHelp(); return; }
  text = String(text).replace(/^letter:/, '');
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/–/g, ','));
    u.lang = 'en-US'; u.rate = 0.85; if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(watch(u));
  } catch(e){}
}

function vocabQs(words, nEnVi, nViEn, nListen, distract){
  const qs = [];
  const pool = shuffle(words);
  let i = 0;
  const others = (w, key) => pick((distract || words).filter(x => x[key] !== w[key]), 2).map(x => x[key]);
  for (let k = 0; k < nEnVi && i < pool.length; k++, i++) {
    const w = pool[i]; qs.push({type:'mc', word:w.en, prompt:`"${w.en}" nghĩa là gì?`, say:w.en, options:shuffle([w.vi, ...others(w,'vi')]), answer:w.vi});
  }
  for (let k = 0; k < nViEn && i < pool.length; k++, i++) {
    const w = pool[i]; qs.push({type:'mc', word:w.en, prompt:`"${w.vi}" trong tiếng Anh là:`, say:w.en, options:shuffle([w.en, ...others(w,'en')]), answer:w.en});
  }
  for (let k = 0; k < nListen && i < pool.length; k++, i++) {
    const w = pool[i];
    if (CAN_SPEAK) qs.push({type:'mc', word:w.en, listen:true, prompt:'Nghe và chọn từ đúng', say:w.en, options:shuffle([w.en, ...others(w,'en')]), answer:w.en});
    else qs.push({type:'mc', word:w.en, prompt:`"${w.en}" nghĩa là gì?`, say:w.en, options:shuffle([w.vi, ...others(w,'vi')]), answer:w.vi});
  }
  return qs;
}
const DL = s => { const [who, en, vi] = s.split('|'); return {who, en, vi}; };
function sentenceQ(les){
  if (!les.d || les.d.length < 3) return null;
  const lines = les.d.map(DL), ln = lines[Math.random() * lines.length | 0];
  const opts = shuffle([ln.vi, ...pick(lines.filter(x => x !== ln), 2).map(x => x.vi)]);
  if (CAN_SPEAK) return {type:'mc', listen:true, prompt:'Nghe câu và chọn nghĩa đúng', say:ln.en, who:ln.who, options:opts, answer:ln.vi};
  return {type:'mc', prompt:`"${ln.en}" nghĩa là:`, say:ln.en, options:opts, answer:ln.vi};
}
function pronQ(les){
  if (!CAN_SPEAK || !les.pr || !les.pr.pairs.length) return null;
  const pair = les.pr.pairs[Math.random() * les.pr.pairs.length | 0], t = pair[Math.random() * 2 | 0];
  return {type:'mc', listen:true, pair:true, prompt:'Phát âm: nghe và chọn đúng cái bạn nghe được', say:t, options:shuffle(pair.slice()), answer:t};
}
function orderQs(patterns, n){
  const ok = patterns.filter(p => !p.en.includes('–')).filter(p => { const k = p.en.split(' ').length; return k >= 3 && k <= 9; });
  return pick(ok, n).map(p => ({type:'order', n:p.n, vi:p.vi, target:p.en, tokens:shuffle(p.en.split(' ').map((t, i) => ({t, i})))}));
}
function grammarQs(qs){
  return qs.map(([prompt, opts, ans]) => { const o = opts.split('|'); return {type:'mc', prompt, options:shuffle(o), answer:o[ans]}; });
}
const QN = {lesson: 20, review: 30, srs: 15};
function srsPool(){
  const u = S.preview ? 24 : S.me.unlocked;
  return LESSONS.filter(x => x.n <= u && !x.review).flatMap(x => x.w.map(s => ({x, w:W(s)})));
}
function weakCount(){
  const m = wrongMap(), pool = new Set(srsPool().map(p => p.w.en));
  return Object.keys(m).filter(k => pool.has(k)).length;
}
function buildQuiz(n){
  const les = L(n);
  let qs;
  if (les.srs) {
    const pool = srsPool(), m = wrongMap();
    const weak = shuffle(pool.filter(p => m[p.w.en])).sort((a, b) => m[b.w.en] - m[a.w.en]).slice(0, 10);
    const cur = S.preview ? 24 : S.me.unlocked;
    const rest = shuffle(pool.filter(p => !weak.includes(p))).sort((a, b) => (a.x.n === cur) - (b.x.n === cur));
    const chosen = shuffle([...weak, ...rest.slice(0, QN.srs - weak.length)]);
    qs = chosen.map(({x, w}, k) => {
      const kind = k % 3;
      return {...vocabQs([w], kind === 0 ? 1 : 0, kind === 1 ? 1 : 0, kind === 2 ? 1 : 0, x.w.map(W))[0], src:'w' + x.n};
    });
  } else if (les.review) {
    const [a, b] = les.review;
    const ls = LESSONS.filter(x => x.n >= a && x.n <= b && !x.review);
    const pairs = pick(ls.flatMap(x => x.w.map(s => ({x, w:W(s)}))), 13);
    qs = pairs.map(({x, w}, k) => ({...vocabQs([w], k % 2 ? 0 : 1, k % 2 ? 1 : 0, 0, x.w.map(W))[0], src:'w' + x.n}));
    pick(ls.filter(x => x.d), 2).forEach(x => qs.push({...sentenceQ(x), src:'s' + x.n}));
    qs.push(...grammarQs(pick(ls.flatMap(x => x.q), 9)));
    qs.push(...orderQs(ls.flatMap(x => x.p.map(s => ({...P(s), n:x.n}))), 6).map(q => ({...q, src:'s' + q.n})));
    qs = shuffle(qs);
  } else {
    const words = les.w.map(W), pq = pronQ(les), sq = sentenceQ(les);
    const extra = (pq ? 0 : 1) + (sq ? 0 : 1) - (n === 1 ? 2 : 0);
    let letterQs = [];
    if (n === 1) {
      const U1 = pick(ALPHA, 1)[0][0], lo = U1.toLowerCase(), U2 = pick(ALPHA, 1)[0][0];
      letterQs = [{type:'mc', prompt:`Chữ thường của chữ hoa ${U1} là:`, say:'letter:' + U1, options:shuffle([lo, ...LOOKALIKE[lo].split('').slice(0, 2)]), answer:lo},
                  {type:'mc', listen:true, prompt:'Nghe tên chữ và chọn chữ đúng', say:'letter:' + U2, options:shuffle([U2, ...SOUNDALIKE[U2].split('').slice(0, 2)]), answer:U2}];
    }
    qs = shuffle([...letterQs, ...vocabQs(words, 4 + extra, 3, 2), ...(sq ? [sq] : []), ...(pq ? [pq] : []), ...orderQs(les.p.map(P), 3), ...grammarQs(les.q)]).map(q => ({...q, src:(q.word ? 'w' : 's') + n}));
  }
  return {n, qs, i:0, right:0, picked:null, built:[], checked:false, done:false};
}

function lessonState(n, prog, unlocked){
  const p = prog[n];
  if (n > unlocked) return 'locked';
  if (p && p.best >= PASS) return 'done';
  return p && p.attempts ? 'tried' : 'new';
}
function lessonList(prog, unlocked, preview){
  let next = 0;
  for (let n = 1; n <= unlocked; n++) if (lessonState(n, prog, unlocked) !== 'done') { next = n; break; }
  const phases = [[1,6,'Giai đoạn 1 · Làm quen'],[7,12,'Giai đoạn 2 · Cuộc sống hằng ngày'],[13,18,'Giai đoạn 3 · Đi ra ngoài'],[19,24,'Giai đoạn 4 · Kể chuyện']];
  return phases.map(([a, b, name]) => {
    let h = `<div class="sect">${name}</div>`;
    for (let n = a; n <= b; n++) {
      const les = L(n), st = preview ? 'new' : lessonState(n, prog, unlocked), p = prog[n];
      const right = st === 'locked' ? '🔒'
        : st === 'done' ? `<span class="chip ok">✓ ${p.best}%</span>`
        : st === 'tried' ? `<span class="chip acc">${p.best}%</span>`
        : (!preview && n === next) ? `<span class="chip acc">Làm ngay</span>` : '';
      h += `<button class="lesson ${st} ${(!preview && n === next) ? 'next' : ''}" data-act="open" data-n="${n}" ${st === 'locked' ? 'disabled' : ''}>
        <div class="num">${n}</div><div class="grow"><div class="t">${esc(les.t)}</div><div class="xs mut">${esc(les.gt)}</div></div>${right}</button>`;
    }
    return h;
  }).join('');
}

function vQuiz(les){
  const Q = S.quiz;
  if (S.loadingAudio) return `<div class="card" style="text-align:center;padding:36px 18px"><div class="spin"></div><p class="mut">Đang tải âm thanh…</p></div>`;

    if (les.srs) return `<div class="card" style="text-align:center;padding:28px 18px">

      <button class="btn full" style="margin-top:18px" data-act="quiz-start">Bắt đầu</button></div>`;
    return `<div class="card" style="text-align:center;padding:28px 18px">
      <div style="font-size:42px">📝</div>
      <h2 style="margin:8px 0 6px">${les.review ? 'Bài kiểm tra ' + total + ' câu' : total + ' câu hỏi'}</h2>
      <p class="mut sm">${les.review ? esc(les.g) : 'Gồm nghĩa từ, nghe, sắp xếp câu và ngữ pháp. Đạt từ ' + PASS + '% là hoàn thành bài.'}</p>
      ${p && p.attempts ? `<p style="margin-top:12px"><span class="chip ${p.best >= PASS ? 'ok' : 'acc'}">Điểm cao nhất: ${p.best}% · ${p.attempts} lần làm</span></p>` : ''}
      <button class="btn full" style="margin-top:18px" data-act="quiz-start">Bắt đầu</button>
    </div>`;
  }
  if (Q.done) {

    if (les.srs) return `<div class="card" style="text-align:center;padding:28px 18px">
      <div style="font-size:42px">${score >= 80 ? '🎉' : '🔁'}</div>
      <div class="big-score" style="color:${score >= 80 ? 'var(--ok)' : 'var(--acc)'}">${Q.right}/${Q.qs.length}</div>
      <p class="mut sm">Còn <b>${weakCount()}</b> từ cần ôn. Ôn mỗi ngày một lượt là nhớ lâu.</p>
      ${S.preview ? '' : (Q.saved ? '<p class="xs mut" style="margin-top:8px">✓ Đã ghi lượt ôn, giáo viên sẽ thấy.</p>' : '<p class="xs mut" style="margin-top:8px">Đang lưu…</p>')}
      <div class="row" style="margin-top:18px"><button class="btn ghost grow" data-act="quiz-start">Ôn tiếp</button><button class="btn grow" data-act="home">Về trang chủ</button></div></div>`;
    return `<div class="card" style="text-align:center;padding:28px 18px">
      <div style="font-size:42px">${pass ? '🎉' : '💪'}</div>
      <div class="big-score" style="color:${pass ? 'var(--ok)' : 'var(--acc)'}">${score}%</div>
      <p><b>${Q.right}/${Q.qs.length} câu đúng</b></p>
      <p class="mut sm" style="margin-top:6px">${pass ? 'Giỏi lắm! Bạn đã hoàn thành bài này.' : 'Gần được rồi. Ôn lại thẻ từ rồi làm lại nhé, cần ' + (les.review ? 70 : PASS) + '%.'}</p>
      ${S.preview ? '<p class="xs mut" style="margin-top:8px">Chế độ xem trước: điểm không được lưu.</p>' : (Q.saved ? '<p class="xs mut" style="margin-top:8px">✓ Đã lưu điểm, giáo viên sẽ thấy.</p>' : '<p class="xs mut" style="margin-top:8px">Đang lưu điểm…</p>')}
      <div class="row" style="margin-top:18px"><button class="btn ghost grow" data-act="quiz-start">Làm lại</button><button class="btn grow" data-act="home">Về trang chủ</button></div>
    </div>`;
  }
  const q = Q.qs[Q.i];
  let h = `<div class="row" style="margin-bottom:8px"><span class="sm mut grow">Câu ${Q.i + 1}/${Q.qs.length}</span><span class="chip ok">Đúng ${Q.right}</span></div>
    <div class="bar" style="margin-bottom:18px"><i style="width:${Q.i / Q.qs.length * 100}%;background:var(--pri)"></i></div>`;
  if (q.type === 'mc') {
    h += `<div class="qprompt">${esc(q.prompt)}</div>`;
    if (q.listen) h += `<div style="text-align:center;margin-bottom:16px"><button class="speak big" data-act="say" data-t="${esc(q.say)}" data-w="${q.who || ''}" ${q.pair ? 'data-p="1"' : ''} aria-label="Nghe lại">🔊</button><p class="xs mut">Chạm để nghe lại</p></div>`;
    h += q.options.map((o, k) => {
      let c = ''; if (Q.checked) { if (o === q.answer) c = 'right'; else if (k === Q.picked) c = 'wrong'; }
      return `<button class="opt ${c}" data-act="pick" data-k="${k}" ${Q.checked ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('');
  } else {
    h += `<div class="qprompt">Sắp xếp thành câu:<br><span class="mut" style="font-weight:500;font-size:17px">"${esc(q.vi)}"</span></div>
      <div class="tokens answer-line">${Q.built.map((ti, k) => `<button class="tok" data-act="unbuild" data-k="${k}" ${Q.checked ? 'disabled' : ''}>${esc(q.tokens[ti].t)}</button>`).join('') || '<span class="sm mut" style="padding:12px 2px">Chạm các từ bên dưới theo đúng thứ tự</span>'}</div>
      <div class="tokens">${q.tokens.map((tk, k) => `<button class="tok ${Q.built.includes(k) ? 'used' : ''}" data-act="build" data-k="${k}" ${Q.checked ? 'disabled' : ''}>${esc(tk.t)}</button>`).join('')}</div>`;
    if (!Q.checked) h += `<button class="btn full" style="margin-top:18px" data-act="check-order" ${Q.built.length !== q.tokens.length ? 'disabled' : ''}>Kiểm tra</button>`;
  }
  if (Q.checked) {
    const good = Q.lastRight;
    h += `<div class="fb ${good ? 'ok' : 'bad'}">${good ? 'Chính xác!' : 'Chưa đúng.'} ${!good ? `<div class="mut">Đáp án: ${esc(q.type === 'order' ? q.target : q.answer)}</div>` : ''}</div>
      <div class="row">${(q.say || q.type === 'order') && CAN_SPEAK ? `<button class="speak" data-act="say" data-t="${esc(q.type === 'order' ? q.target : q.say)}" data-w="${q.type === 'order' ? '' : (q.who || '')}" aria-label="Nghe">🔊</button>` : ''}
      <button class="btn grow" data-act="next">${Q.i + 1 < Q.qs.length ? 'Câu tiếp →' : 'Xem kết quả'}</button></div>`;
  }
  return h;
}

function tStats(){
  const T = S.T, u = T.unlocked, held = Object.keys(T.attendance).length;
  return T.students.map(s => {
    const prog = {}; T.progress.filter(p => p.code === s.code).forEach(p => prog[p.n] = p);
    const tried = Object.values(prog).filter(p => p.attempts);
    const avg = tried.length ? Math.round(tried.reduce((a, p) => a + p.best, 0) / tried.length) : null;
    let done = 0, owe = 0;
    for (let n = 1; n <= u; n++) { const ok = prog[n] && prog[n].best >= PASS; if (ok) done++; else if (n < u) owe++; }
    const present = Object.values(T.attendance).filter(a => a.present.includes(s.code)).length;
    const idle = !s.lastActive || (Date.now() - s.lastActive) > 3 * 864e5;
    return {...s, prog, avg, done, owe, present, held, idle, alert: owe > 0 || idle};
  });
}

async function loginStudent(code){
  S.busy = true; S.err = null; render();
  try {
    const r = await call('studentLogin', code);
    if (!r.ok) { S.err = r.error; S.mode = 'login'; store.del('hv_code'); }
    else { S.me = r; S.code = r.student.code; store.set('hv_code', S.code); S.mode = 'student'; S.view = 'home'; S.preview = false;
      bcall('boardStatus').then(b => { if (!!b.open !== B.open) { B.open = !!b.open; render(); } }).catch(() => {}); }
  } catch(e){ S.err = 'Không kết nối được: ' + errMsg(e); S.mode = 'login'; }
  S.busy = false; render();
}
async function loginTeacher(pw){
  S.busy = true; S.err = null; render();
  try {
    S.T = await call('teacherData', pw); S.pw = pw; store.set('gv_pw', pw); S.mode = 'teacher'; S.view = 'home';
    if (typeof fbTeacherLogin === 'function') fbTeacherLogin(pw).catch(e => toast(errMsg(e)));
  } catch(e){ S.err = errMsg(e); S.mode = 'tlogin'; store.del('gv_pw'); }
  S.busy = false; render();
}
async function tCall(fn, ...args){
  S.busy = true; render();
  try { S.T = await call(fn, S.pw, ...args); S.busy = false; render(); return true; }
  catch(e){ S.busy = false; render(); toast(errMsg(e)); return false; }
}
async function saveResult(n, score){
  if (S.preview) return;
  const learned = learnedSet(n).size;
  try {
    const r = n === 0 ? await call('logReview', S.code, score) : await call('saveProgress', S.code, n, score, learned);
    if (r.ok) { S.me = r; if (S.quiz && S.quiz.n === n) S.quiz.saved = true; }
    else toast(r.error);
  } catch(e){ toast('Chưa lưu được điểm: ' + errMsg(e)); }
  render();
}

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'close-bg' && e.target !== el) return;
  switch (a) {
    case 'login': { const c = document.getElementById('code').value.trim().toUpperCase(); if (c) loginStudent(c); break; }
    case 'to-tlogin': go({mode:'tlogin', err:null}); break;
    case 'to-login': go({mode:'login', err:null}); break;
    case 'tlogin': { const p = document.getElementById('pw').value; if (p) loginTeacher(p); break; }
    case 'logout':
      if (S.mode === 'teacher') { store.del('gv_pw'); S.pw = null; if (typeof fbLogout === 'function') fbLogout(); } else { store.del('hv_code'); S.code = null; }

  let chunk = [], size = 0;
  const flush = () => { room.emit('board', {k:'sync', st:DBB.state, items:chunk}).catch(() => {}); chunk = []; size = 0; };
  if (!list.length) { flush(); return; }
  list.forEach(it => { const n = JSON.stringify(it).length; if (size + n > 3300 && chunk.length) flush(); chunk.push(it); size += n; });

    const list = FBB.subEpoch === E ? FBB.items : [], from = epoch === E ? Math.min(since, list.length) : 0;

  },
  async boardAdd(auth, item){
    const T = S.mode === 'teacher';
    if (T) await fbNeedTeacher(); else if (!FBB.state.open) throw new Error('Giáo viên đã đóng bảng.');
    let p = item.p;
    while (p && p.length > 600) p = p.filter((v, i) => (i >> 1) % 2 === 0 || i >= p.length - 2);  /* gọn nét quá dài */
    const doc = {...item, who:T ? 'GV' : String(S.code || '?').slice(0, 12), name:T ? 'Giáo viên' : String((S.me && S.me.student.name) || '').slice(0, 60)};

(async () => {

function startBoard(){
  stopBoard();
  B.lastChange = Date.now();
  const tick = () => {
    if (S.view !== 'board') return;
    const quiet = Date.now() - B.lastChange;
    /* hỏi máy chủ liên tục khi bảng đang có người viết, thưa dần khi bảng yên */
    const wait = FBB.on ? 1500 : document.hidden ? 4000 : quiet < 30000 ? 250 : quiet < 120000 ? 800 : 2500;
    B.timer = setTimeout(async () => { await pollBoard(); tick(); }, wait);
  };
  pollBoard().then(tick);
}
function stopBoard(){ if (B.timer) clearTimeout(B.timer); B.timer = null; }
async function pollBoard(){
  if (B.busy) return; B.busy = true;
  try {
    const r = await bcall('boardState', B.seq, B.epoch, bAuth());
    const wasOpen = B.open; B.open = !!r.open;
    if (!r.open && S.mode !== 'teacher') { B.busy = false; stopBoard(); B.textAt = null; go({view:'home'}); toast('Giáo viên đã đóng bảng lớp.'); return; }
    if (S.mode === 'teacher' && wasOpen !== B.open) render();
    let changed = false;
    if (r.full || r.epoch !== B.epoch) { B.items = new Map(); B.deleted = new Set(); B.pending = B.epoch && r.epoch !== B.epoch ? [] : B.pending; changed = true; }
    B.epoch = r.epoch; B.seq = r.seq;
    r.items.forEach(it => { B.items.set(it.id, it); if (it.type === 'd') B.deleted.add(it.target); changed = true; });
    if (changed) { B.pending = B.pending.filter(p => !p.id || !B.items.has(p.id)); B.lastChange = Date.now(); }
    const pid = r.prompt && r.prompt.id, old = B.prompt && B.prompt.id;
    const revealChanged = r.prompt && B.prompt && r.prompt.reveal !== B.prompt.reveal;
    B.prompt = r.prompt;
    if (pid !== old || revealChanged) { B.lastChange = Date.now(); render(); if (pid !== old && pid && S.mode !== 'teacher') playPrompt(); }
    else if (changed) drawBoard();
    const st = document.getElementById('bstatus'); if (st) st.textContent = (FBB.on && !FBB.connected) ? '○ Mất kết nối, đang thử lại…' : '● Đang kết nối';

}
async function addItem(item){
  const local = {...item, who:bMe(), name:'', _local:true};
  B.pending.push(local); drawBoard(); B.lastChange = Date.now();
  try { local.id = await bcall('boardAdd', bAuth(), item); pollBoard(); }
  catch(e){ B.pending = B.pending.filter(p => p !== local); drawBoard(); toast(errMsg(e)); }

/* ---- Vẽ ---- */
function drawBoard(){
  const cv = document.getElementById('bd'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.width * BH / BW * dpr); }
  const ctx = cv.getContext('2d'), k = cv.width / BW;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const all = [...B.items.values(), ...B.pending.filter(p => !p.id || !B.items.has(p.id)), ...(B.live ? [B.live] : [])];
  const lines = new Set(all.filter(it => it.type === 't' && !(it.id && B.deleted.has(it.id))).map(it => it.who + '|' + it.x + '|' + it.y));
  for (const it of all) {
    if (it.type === 'd' || (it.id && B.deleted.has(it.id))) continue;
    if (it.type === 's') {
      const p = it.p; ctx.strokeStyle = it.c; ctx.lineWidth = it.w; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
      if (p.length === 2) ctx.lineTo(p[0] + 0.1, p[1]);
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
      ctx.stroke();
    } else if (it.type === 't') {
      ctx.fillStyle = it.c; ctx.font = '600 40px Lexend, system-ui, sans-serif'; ctx.textBaseline = 'top'; ctx.fillText(it.text, it.x, it.y);
      if (it.name && !lines.has(it.who + '|' + it.x + '|' + (it.y - 56))) { ctx.fillStyle = '#6B7280'; ctx.font = '500 18px system-ui, sans-serif'; ctx.fillText(it.name, it.x, it.y - 20); }
    }
  }
}
function bPoint(e){
  const cv = document.getElementById('bd'), r = cv.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) / r.width * BW), Math.round((e.clientY - r.top) / r.height * BH)];
}
$app.addEventListener('pointerdown', e => {
  if (e.target.id !== 'bd') return;
  e.preventDefault();
  const [x, y] = bPoint(e);
  const tap = B.tap;
  if (tap && Date.now() - tap.t < 350 && Math.abs(tap.x - x) + Math.abs(tap.y - y) < 50) {
    clearTimeout(tap.timer); B.tap = null; openText(tap.x, tap.y); return;
  }
  if (B.mode === 'text' || B.textAt) { if (B.textAt && commitText()) return; openText(x, y); return; }
  try { e.target.setPointerCapture(e.pointerId); } catch(x){}
  B.live = {type:'s', c:B.pen, w:S.mode === 'teacher' ? 5 : 4, p:[x, y]};
  drawBoard();
});
$app.addEventListener('pointermove', e => {
  if (!B.live || e.target.id !== 'bd') return;
  const [x, y] = bPoint(e), p = B.live.p;
  if (Math.abs(p[p.length - 2] - x) + Math.abs(p[p.length - 1] - y) < 3) return;
  if (p.length < 1200) { p.push(x, y); drawBoard(); }
});
const endStroke = () => {
  if (!B.live) return;
  const s = B.live; B.live = null;
  if (s.p.length <= 2) {   /* một cú chạm: chờ xem có chạm lần 2 để gõ chữ không */
    const [x, y] = s.p;
    B.tap = {x, y, t:Date.now(), timer:setTimeout(() => { B.tap = null; addItem({type:'s', c:s.c, w:s.w, p:s.p}); }, 350)};
    drawBoard(); return;
  }
  addItem({type:'s', c:s.c, w:s.w, p:s.p});
};
function openText(x, y){
  B.textAt = {x, y: Math.max(22, Math.min(BH - 50, y))}; B.textVal = '';
  render();
  const i = document.getElementById('btext'); if (i) i.focus();
}
function textPos(){
  const box = document.querySelector('.btext'); if (!box || !B.textAt) return;
  box.style.left = `max(4px, min(${B.textAt.x / BW * 100}%, calc(100% - 262px)))`;
  box.style.top = `min(${B.textAt.y / BH * 100}%, calc(100% - 50px))`;
}
function commitText(keepOpen){
  const i = document.getElementById('btext'); const v = ((i && i.value) || B.textVal || '').trim();
  const at = B.textAt; B.textVal = '';
  if (v) addItem({type:'t', text:v, x:at.x, y:at.y, c:B.pen});
  if (keepOpen && i) {             /* Enter: chữ lên bảng, ô gõ xuống dòng dưới, gõ tiếp luôn */
    B.textAt = {x:at.x, y: v ? (at.y + 56 > BH - 50 ? 40 : at.y + 56) : at.y};
    i.value = ''; textPos(); i.focus();
    return !!v;
  }
  B.textAt = null;
  render();
  return !!v;
}
$app.addEventListener('pointerup', endStroke);
$app.addEventListener('pointercancel', endStroke);

const BKINDS = [['tu','Viết từ'],['nghe','Nghe – viết'],['cau','Viết câu'],['nghia','Ghi nghĩa'],['chu','Chữ thường'],['van','Đánh vần tên']];
function makePrompt(kind, n){
  let les = L(n);
  if (les.review) { const [a, b] = les.review; const ls = LESSONS.filter(x => x.n >= a && x.n <= b && !x.review); les = ls[Math.random() * ls.length | 0]; }
  const w = W(les.w[Math.random() * les.w.length | 0]), p = P(les.p[Math.random() * les.p.length | 0]);
  const base = {id:Date.now(), n:les.n, reveal:false};
  if (kind === 'nghe') return {...base, text:'Nghe và viết lại từ', answer:w.en, say:w.en};
  if (kind === 'cau') return {...base, text:`Viết câu tiếng Anh: “${p.vi}”`, answer:p.en, sayAns:p.en};
  if (kind === 'nghia') return {...base, text:`Ghi nghĩa tiếng Việt (hoặc vẽ hình) của: ${w.en}`, answer:w.vi, say:w.en};
  if (kind === 'chu') { const U = pick(ALPHA, 3).map(a => a[0]); return {...base, n:1, text:`Viết chữ thường của: ${U.join('   ')}`, answer:U.map(u => u.toLowerCase()).join('   ')}; }
  if (kind === 'van') { const nm = NAMES[Math.random() * NAMES.length | 0]; return {...base, n:1, text:'Nghe đánh vần rồi viết tên', answer:nm, spell:nm}; }
  return {...base, text:`Viết từ tiếng Anh có nghĩa: “${w.vi}”`, answer:w.en, sayAns:w.en};
}

const callT = () => S.mode === 'teacher';
let $call = null;

function callMyName(){ return callT() ? 'Giáo viên' : String((S.me && S.me.student.name) || 'Học viên').slice(0, 60); }
async function callIce(){
  if (CALL.ice) return CALL.ice;
  try {   /* máy chủ chuyển tiếp (TURN) nếu đã cài trong Apps Script; chưa có thì chỉ dùng STUN */
    const r = await Promise.race([call('getIce'), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 4000))]);
    if (r && r.length) { CALL.ice = r; return r; }
  } catch(e){}
  CALL.ice = CALL_STUN; return CALL.ice;
}

/* ---------- theo dõi trạng thái cuộc gọi (chạy khi Firebase sẵn sàng) ---------- */
function callInit(force){
  if (!force && (!REAL || typeof FB_CFG === 'undefined' || !FB_CFG)) return;
  if (!FBB.m || !FBB.db) return setTimeout(() => callInit(force), 400);
  FBB.m.onValue(callRef('state'), s => {
    const st = s.val() || {}, was = CALL.state;
    const fresh = !st.at || Date.now() - st.at < 4 * 3600e3;
    CALL.state = st.on && fresh ? st : null;
    if (CALL.joined && (!CALL.state || CALL.state.id !== CALL.id)) { callLeave(true); toast('Cuộc gọi lớp đã kết thúc.'); }
    if (CALL.joined && CALL.state && !callT() && st.muteAt && st.muteAt > CALL.joinAt && st.muteAt !== CALL.lastMuteAt) {
      CALL.lastMuteAt = st.muteAt; if (!CALL.muted) { callSetMute(true); toast('Giáo viên đã tắt mic cả lớp.'); }
    }
    if (CALL.state && !CALL.joined && !callT() && CALL.ringed !== CALL.state.id) { CALL.ringed = CALL.state.id; callRing(); }
    renderCall();
  });
}
callInit();

function callRing(){
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch(e){}
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C(), t0 = ctx.currentTime + 0.05;
    [0, 0.35, 1.2, 1.55].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = d % 1.2 < 0.3 ? 880 : 660; g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + d + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.28);
      o.connect(g).connect(ctx.destination); o.start(t0 + d); o.stop(t0 + d + 0.3); });
    setTimeout(() => ctx.close(), 2500);
  } catch(e){}
}

/* ---------- giáo viên ---------- */
async function callStart(){
  try {
    await fbNeedTeacher();
    const id = Date.now().toString(36);
    await FBB.m.set(callRef('state'), {on:true, id, at:Date.now(), muteAt:0});
    await callJoin();
  } catch(e){ toast(errMsg(e)); }
}
async function callEnd(){
  const id = CALL.id || (CALL.state && CALL.state.id);
  callLeave(true);
  try { await fbNeedTeacher(); const up = {state:{on:false, at:Date.now()}}; if (id) { up['peers/' + id] = null; up['sig/' + id] = null; } await FBB.m.update(callRef(), up); }
  catch(e){ toast(errMsg(e)); }
  renderCall();
}
async function callMuteAll(){
  try { await fbNeedTeacher(); await FBB.m.update(callRef('state'), {muteAt:Date.now()}); toast('Đã tắt mic cả lớp.'); } catch(e){ toast(errMsg(e)); }
}

/* ---------- vào / rời cuộc gọi ---------- */
async function callJoin(){
  if (CALL.joined || CALL.joining || !CALL.state) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection) { toast('Trình duyệt này chưa gọi được. Hãy mở bằng Chrome hoặc Safari bản mới.'); return; }
  CALL.joining = true; renderCall();
  try {
    const ice = await callIce();
    CALL.local = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false});
    const C = window.AudioContext || window.webkitAudioContext; if (C) { CALL.ctx = new C(); try { await CALL.ctx.resume(); } catch(e){} }
    CALL.id = CALL.state.id; CALL.joinAt = Date.now(); CALL.lastMuteAt = CALL.state.muteAt || 0;
    CALL.me = (callT() ? 'gv-' : 'hv-') + Math.random().toString(36).slice(2, 10);
    CALL.joined = true; CALL.peers = {}; CALL.list = {};
    callSetMute(!callT());                        /* giáo viên mở mic sẵn, học viên tắt sẵn */
    callMeter('me', CALL.local);
    const m = FBB.m;
    CALL.presRef = callRef(`peers/${CALL.id}/${CALL.me}`);
    await m.set(CALL.presRef, {name:callMyName(), who:callT() ? 'GV' : String(S.code || '?').slice(0, 12), t:Date.now(), mic:!CALL.muted});
    m.onDisconnect(CALL.presRef).remove();
    const pr = callRef('peers/' + CALL.id);
    CALL.unsubs.push(m.onChildAdded(pr, s => { if (s.key === CALL.me) return; CALL.list[s.key] = s.val(); if (CALL.me < s.key) callPeer(s.key, true, ice); renderCall(); }));
    CALL.unsubs.push(m.onChildChanged(pr, s => { if (s.key !== CALL.me) { CALL.list[s.key] = s.val(); renderCall(); } }));
    CALL.unsubs.push(m.onChildRemoved(pr, s => { delete CALL.list[s.key]; callDrop(s.key); renderCall(); }));
    const inbox = callRef(`sig/${CALL.id}/${CALL.me}`);
    CALL.unsubs.push(m.onChildAdded(inbox, s => { const v = s.val(); m.remove(s.ref).catch(() => {}); callSignal(v, ice).catch(e => console.warn('call signal', e)); }));
    CALL.meterT = setInterval(callMeterTick, 250);
    CALL.open = true;
  } catch(e){
    const msg = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? 'Chưa có quyền dùng micro. Hãy cho phép micro cho trang này rồi bấm vào lại.' : errMsg(e);
    callLeave(true); toast(msg);
  } finally { CALL.joining = false; renderCall(); }
}
function callLeave(silent){
  Object.keys(CALL.peers).forEach(callDrop);
  CALL.unsubs.forEach(u => { try { u(); } catch(e){} }); CALL.unsubs = [];
  if (CALL.presRef) { try { FBB.m.remove(CALL.presRef).catch(() => {}); FBB.m.onDisconnect(CALL.presRef).cancel(); } catch(e){} CALL.presRef = null; }
  if (CALL.local) { CALL.local.getTracks().forEach(t => t.stop()); CALL.local = null; }
  clearInterval(CALL.meterT); if (CALL.ctx) { try { CALL.ctx.close(); } catch(e){} CALL.ctx = null; }
  CALL.levels = {}; CALL.meters = {}; CALL.joined = false; CALL.list = {}; CALL.id = null;
  if (!silent) renderCall();
}
function callSetMute(on){
  CALL.muted = on;
  if (CALL.local) CALL.local.getAudioTracks().forEach(t => { t.enabled = !on; });
  if (CALL.presRef) FBB.m.update(CALL.presRef, {mic:!on}).catch(() => {});
  renderCall();
}

/* ---------- kết nối từng cặp máy ---------- */
function callSend(to, msg){ return FBB.m.push(callRef(`sig/${CALL.id}/${to}`), {...msg, from:CALL.me}); }
function callPeer(pid, initiator, ice){
  if (CALL.peers[pid]) return CALL.peers[pid];
  const pc = new RTCPeerConnection({iceServers:ice});
  const P = CALL.peers[pid] = {pc, q:[], st:'connecting'};
  CALL.local.getTracks().forEach(t => pc.addTrack(t, CALL.local));
  pc.onicecandidate = e => { if (e.candidate) callSend(pid, {t:'ice', c:JSON.stringify(e.candidate)}).catch(() => {}); };
  pc.ontrack = e => {
    const st = e.streams[0] || new MediaStream([e.track]);
    if (!P.audio) { P.audio = document.createElement('audio'); P.audio.autoplay = true; P.audio.setAttribute('playsinline', ''); callAudioBox().appendChild(P.audio); }
    P.audio.srcObject = st; const pl = P.audio.play(); if (pl) pl.catch(() => toast('Bấm vào màn hình một lần để nghe tiếng.'));
    callMeter(pid, st);
  };
  pc.onconnectionstatechange = () => {
    P.st = pc.connectionState === 'connected' ? 'ok' : (pc.connectionState === 'failed' ? 'fail' : (pc.connectionState === 'disconnected' ? 'lost' : 'connecting'));
    if (pc.connectionState === 'failed' && initiator) { try { pc.restartIce(); callOffer(pid, P, true); } catch(e){} }
    renderCall();
  };
  if (initiator) callOffer(pid, P, false);
  return P;
}
async function callOffer(pid, P, restart){
  const o = await P.pc.createOffer(restart ? {iceRestart:true} : {});
  await P.pc.setLocalDescription(o);
  await callSend(pid, {t:'offer', sdp:P.pc.localDescription.sdp});
}
async function callSignal(v, ice){
  if (!v || !v.from || !CALL.joined) return;
  if (v.t === 'offer') {
    const P = CALL.peers[v.from] || callPeer(v.from, false, ice);
    await P.pc.setRemoteDescription({type:'offer', sdp:v.sdp});
    const a = await P.pc.createAnswer(); await P.pc.setLocalDescription(a);
    await callSend(v.from, {t:'answer', sdp:P.pc.localDescription.sdp});
    P.q.splice(0).forEach(c => P.pc.addIceCandidate(c).catch(() => {}));
  } else if (v.t === 'answer') {
    const P = CALL.peers[v.from]; if (!P) return;
    await P.pc.setRemoteDescription({type:'answer', sdp:v.sdp});
    P.q.splice(0).forEach(c => P.pc.addIceCandidate(c).catch(() => {}));
  } else if (v.t === 'ice') {
    const P = CALL.peers[v.from]; let c; try { c = JSON.parse(v.c); } catch(e){ return; }
    if (!P || !P.pc.remoteDescription) { (P ? P.q : []).push(c); return; }
    P.pc.addIceCandidate(c).catch(() => {});
  }
}
function callDrop(pid){
  const P = CALL.peers[pid]; if (!P) return;
  try { P.pc.close(); } catch(e){}
  if (P.audio) { P.audio.srcObject = null; P.audio.remove(); }
  delete CALL.peers[pid]; if (CALL.meters) delete CALL.meters[pid]; delete CALL.levels[pid];
}
function callAudioBox(){
  let b = document.getElementById('callaudio');
  if (!b) { b = document.createElement('div'); b.id = 'callaudio'; b.style.display = 'none'; document.body.appendChild(b); }
  return b;
}

/* ---------- ai đang nói ---------- */
function callMeter(id, stream){
  if (!CALL.ctx) return; CALL.meters = CALL.meters || {};
  try { const src = CALL.ctx.createMediaStreamSource(stream), an = CALL.ctx.createAnalyser(); an.fftSize = 512; src.connect(an); CALL.meters[id] = {an, buf:new Uint8Array(an.fftSize)}; } catch(e){}
}
function callMeterTick(){
  Object.entries(CALL.meters || {}).forEach(([id, M]) => {
    M.an.getByteTimeDomainData(M.buf); let s = 0; for (let i = 0; i < M.buf.length; i++) { const x = (M.buf[i] - 128) / 128; s += x * x; }
    const talk = Math.sqrt(s / M.buf.length) > 0.035 && !(id === 'me' && CALL.muted);
    const el = document.querySelector(`#callui [data-cp="${id}"]`); if (el) el.classList.toggle('talk', talk);
  });
}

/* ---------- giao diện (nằm ngoài khung app để không bị vẽ lại mất) ---------- */
function renderCall(){
  if (!$call) { $call = document.createElement('div'); $call.id = 'callui'; document.body.appendChild($call); $call.addEventListener('click', callClick); }
  const st = CALL.state, T = callT();
  if (!(S.mode === 'teacher' || S.mode === 'student') || (!st && !CALL.joined)) { $call.innerHTML = ''; return; }
  if (!CALL.joined) {
    $call.innerHTML = `<div class="callbar ring"><span class="cico">📞</span><div class="grow"><b>${T ? 'Cuộc gọi lớp đang mở' : 'Giáo viên đang gọi lớp'}</b><div class="xs">${CALL.joining ? 'Đang kết nối…' : (T ? 'Bạn chưa ở trong cuộc gọi' : 'Bấm vào nghe, mic của bạn tắt sẵn')}</div></div>
      <button class="cbtn go" data-act="call-join" ${CALL.joining ? 'disabled' : ''}>${T ? 'Vào lại' : 'Vào nghe'}</button>${T ? '<button class="cbtn end" data-act="call-end">Kết thúc</button>' : ''}</div>`;
    return;
  }
  const others = Object.entries(CALL.list), n = others.length + 1;
  const stTxt = pid => { const P = CALL.peers[pid]; return !P ? 'đang nối…' : P.st === 'ok' ? '' : P.st === 'fail' ? 'không nối được' : P.st === 'lost' ? 'mất kết nối' : 'đang nối…'; };
  const row = (id, name, mic, note) => `<div class="cprow"><span class="cdot" data-cp="${id}"></span><span class="grow">${esc(name)}${note ? ` <span class="xs mut">· ${note}</span>` : ''}</span><span class="xs">${mic ? '🎤' : '<span class="mut">mic tắt</span>'}</span></div>`;
  const list = CALL.open ? `<div class="cplist">${row('me', callMyName() + ' (bạn)', !CALL.muted, '')}${others.sort((a, b) => (a[1].who === 'GV' ? -1 : b[1].who === 'GV' ? 1 : String(a[1].name).localeCompare(b[1].name))).map(([pid, v]) => row(pid, v.name, v.mic, stTxt(pid))).join('')}</div>` : '';
  $call.innerHTML = `<div class="callbar on">${list}<div class="crow"><span class="cdot live"></span><button class="cinfo" data-act="call-list"><b>Đang gọi</b> · ${n} người ${CALL.open ? '▾' : '▸'}</button>
    <button class="cbtn ${CALL.muted ? 'mut' : 'go'}" data-act="call-mic" aria-label="${CALL.muted ? 'Bật mic' : 'Tắt mic'}">${CALL.muted ? '🎤 Bật mic' : '🎤 Tắt mic'}</button>
    ${T ? '<button class="cbtn" data-act="call-muteall">Tắt mic lớp</button><button class="cbtn end" data-act="call-end">Kết thúc</button>' : '<button class="cbtn end" data-act="call-leave">Rời</button>'}</div></div>`;
}
function callClick(e){
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'call-join') callJoin();
  else if (a === 'call-leave') { callLeave(); }
  else if (a === 'call-end') { if (confirmEnd()) callEnd(); }
  else if (a === 'call-mic') callSetMute(!CALL.muted);
  else if (a === 'call-muteall') callMuteAll();
  else if (a === 'call-list') { CALL.open = !CALL.open; renderCall(); }
}
function confirmEnd(){ CALL._endT = CALL._endT && Date.now() - CALL._endT < 3000 ? 0 : Date.now(); if (CALL._endT) { toast('Bấm Kết thúc lần nữa để tắt cuộc gọi cho cả lớp.'); return false; } return true; }
/* nút "Gọi lớp" ở thanh dưới của giáo viên nằm trong khung app */
document.addEventListener('click', e => { const b = e.target.closest('#app [data-act="call-start"]'); if (!b) return; e.stopPropagation(); if (!REAL || !FBB.on) { toast('Gọi lớp chỉ dùng được trên app thật.'); return; } if (CALL.joined) { CALL.open = true; renderCall(); } else if (CALL.state) callJoin(); else callStart(); }, true);
window.addEventListener('pagehide', () => { if (CALL.joined) callLeave(true); });
</script>
